<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>YSP Live Player</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;
            font-family:"Microsoft YaHei",system-ui,sans-serif;color:#fff}
  #v{width:100%;height:100%;background:#000;object-fit:contain}
  #hud{position:fixed;left:0;right:0;bottom:0;padding:12px 18px;
       background:linear-gradient(transparent,rgba(0,0,0,.85));
       display:flex;gap:14px;align-items:center;font-size:13px;
       transition:opacity .3s;opacity:0;pointer-events:none}
  #hud.show{opacity:1;pointer-events:auto}
  #state{position:fixed;top:14px;left:18px;font-size:12px;color:#9aa6b5}
  button{background:#1e242e;color:#f2f4f8;border:0;border-radius:8px;
         padding:7px 14px;font-size:13px;cursor:pointer}
  button:hover{background:#2a3340}
  #err{position:fixed;inset:0;display:none;place-content:center;text-align:center;
       padding:40px;font-size:15px;line-height:1.7;color:#ff8a94}
</style>
</head>
<body>
<video id="v" muted playsinline autoplay></video>
<div id="state">connecting…</div>
<div id="hud">
  <button id="pp">暂停</button>
  <button id="mute">取消静音</button>
  <button id="reload">重载</button>
  <span id="info"></span>
</div>
<div id="err"></div>

<script src="hls.min.js"></script>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var src = params.get('src');
  var v = document.getElementById('v');
  var stateEl = document.getElementById('state');
  var errEl = document.getElementById('err');
  var hud = document.getElementById('hud');
  var info = document.getElementById('info');
  var hls = null;

  function setState(t) { stateEl.textContent = t; }

  function fail(t) {
    errEl.style.display = 'grid';
    errEl.textContent = t;
    setState('error');
  }

  if (!src) { fail('缺少 src 参数'); return; }

  if (window.Hls && Hls.isSupported()) {
    hls = new Hls({ enableWorker: true, lowLatencyMode: false,
                    maxBufferLength: 30, backBufferLength: 30 });
    hls.on(Hls.Events.MANIFEST_PARSED, function (e, data) {
      setState('ready');
      v.play().catch(function () {});
    });
    hls.on(Hls.Events.LEVEL_SWITCHED, function () {
      if (hls.levels && hls.currentLevel >= 0) {
        var lv = hls.levels[hls.currentLevel];
        info.textContent = (lv.height ? lv.height + 'p' : '') +
          (lv.bitrate ? ' · ' + Math.round(lv.bitrate / 1000) + 'kbps' : '');
      }
    });
    hls.on(Hls.Events.ERROR, function (e, d) {
      if (!d.fatal) return;
      setState('error: ' + d.details);
      if (d.type === Hls.ErrorTypes.NETWORK_ERROR) {
        setTimeout(function () { hls.startLoad(); }, 1200);
      } else if (d.type === Hls.ErrorTypes.MEDIA_ERROR) {
        hls.recoverMediaError();
      } else {
        fail('播放失败：' + d.details);
      }
    });
    hls.loadSource(src);
    hls.attachMedia(v);
  } else if (v.canPlayType('application/vnd.apple.mpegurl')) {
    v.src = src;
    setState('native hls');
  } else {
    fail('该环境不支持 HLS 播放');
  }

  v.addEventListener('playing', function () { setState('playing'); });
  v.addEventListener('waiting', function () { setState('buffering'); });
  v.addEventListener('error', function () {
    setState('video error');
  });

  document.getElementById('pp').onclick = function () {
    if (v.paused) { v.play(); this.textContent = '暂停'; }
    else { v.pause(); this.textContent = '播放'; }
    poke();
  };
  document.getElementById('mute').onclick = function () {
    v.muted = !v.muted;
    this.textContent = v.muted ? '取消静音' : '静音';
    if (!v.muted) v.volume = 1;
    poke();
  };
  document.getElementById('reload').onclick = function () {
    location.reload();
  };

  var hideTimer = null;
  function poke() {
    hud.classList.add('show');
    if (hideTimer) clearTimeout(hideTimer);
    hideTimer = setTimeout(function () { hud.classList.remove('show'); }, 3000);
  }
  document.addEventListener('mousemove', poke);
  document.addEventListener('keydown', function (e) {
    if (e.key === ' ') { e.preventDefault(); document.getElementById('pp').click(); }
    if (e.key === 'f' || e.key === 'F') {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else document.exitFullscreen();
    }
  });
  poke();
})();
</script>
</body>
</html>
