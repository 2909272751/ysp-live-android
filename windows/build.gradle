plugins {
    id 'java'
    id 'application'
}

// Windows 桌面版。
//
// 说明：core 模块是被 Android Library 插件管理的，它的变体属性（AgpVersionAttr 等）
// 与纯 Java 消费者不兼容，无法直接 `implementation project(':core')`。
// 但 core 本身就是零 Android 依赖的纯 Java 源码，所以这里直接把它的源目录
// 加进 sourceSets —— 同一份代码、不复制、不 fork，只是参与不同的构建。
def coreDir = file('../core/src/main/java')

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java', coreDir]
        }
        resources {
            srcDirs = ['src/main/resources']
        }
    }
    test {
        java {
            srcDirs = ['src/test/java']
        }
    }
}

dependencies {
    implementation "org.openjfx:javafx-base:21.0.2:win"
    implementation "org.openjfx:javafx-graphics:21.0.2:win"
    implementation "org.openjfx:javafx-controls:21.0.2:win"
    implementation "org.openjfx:javafx-swing:21.0.2:win"
    // vlcj：内嵌 libVLC 播放器（HLS + H.264/HEVC 硬解），随包分发精简 libVLC
    implementation 'uk.co.caprica:vlcj:4.8.2'
    implementation 'uk.co.caprica:vlcj-natives:4.8.1'
    implementation 'net.java.dev.jna:jna:5.14.0'
    implementation 'net.java.dev.jna:jna-platform:5.14.0'
    testImplementation 'junit:junit:4.13.2'
}

def mainClassName = 'com.gary.ysplive.desktop.App'

application {
    mainClass = mainClassName
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // core 里有一处 java.lang.management 的可选用法，桌面端完全可用
    options.compilerArgs << '-Xlint:-options'
}

jar {
    manifest {
        attributes 'Main-Class': mainClassName
    }
}

/**
 * 生成可直接 `java -jar` 运行的单文件 jar（含 core + JavaFX 依赖 + web 资源）。
 * JavaFX 的 native dll 在 -win 分类的 jar 里，会一并打进去，启动时自动释放。
 */
tasks.register('fatJar', Jar) {
    group = 'distribution'
    description = '打包成单个可执行 jar（含 core 与 JavaFX）'
    archiveFileName = 'YspLive-Desktop.jar'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes 'Main-Class': 'com.gary.ysplive.desktop.Launcher'
    }
    from sourceSets.main.output
    dependsOn configurations.runtimeClasspath
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/MANIFEST.MF'
    exclude 'module-info.class'
}
