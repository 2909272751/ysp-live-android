plugins {
    id 'com.android.application'
}

// 发布签名：优先用仓库内的 app/ysp-release.jks（或 YSP_KEYSTORE 指定的文件、环境变量口令）；
// 该文件不存在时回退到 tools/debug.keystore，保证任何机器上 assembleRelease 都能产出可安装的 APK。
def releaseStoreFile = System.getenv('YSP_KEYSTORE') ?: 'ysp-release.jks'
def releaseStorePassword = System.getenv('YSP_KEYSTORE_PASS') ?: 'ysp-live-release'
def releaseKeyAlias = System.getenv('YSP_KEY_ALIAS') ?: 'ysplive'
def releaseKeyPassword = System.getenv('YSP_KEY_PASS') ?: 'ysp-live-release'
def hasReleaseKey = file(releaseStoreFile).exists()

android {
    namespace 'com.gary.ysplive'
    compileSdk 34

    defaultConfig {
        // applicationId 由各 flavor 覆盖（phone / tv 用不同包名，可同时安装）
        minSdk 21
        targetSdk 34
        versionCode 913
        versionName '9.6.4'
        resourceConfigurations += ['zh', 'en']
    }

    // ------------------------------------------------------------------
    // 手机版 / 电视版 拆分成两个独立 APK
    //
    // 为什么必须拆：
    //   手机是「竖屏 + 触摸」，电视是「横屏 + 遥控器 D-pad」，交互模型不同。
    //   触摸要 clickable + 大点击区；遥控器要 focusable + 明显焦点态。
    //   合在一个包里必然互相妥协——这次「遥控器选不中」就是典型的混合代价。
    //
    // 拆分后：
    //   phone flavor -> app/src/phone/**  （触摸优先 UI）
    //   tv    flavor -> app/src/tv/**     （10 英尺 / 遥控器优先 UI）
    //   公共逻辑仍放 app/src/main/**
    // ------------------------------------------------------------------
    flavorDimensions += 'form'
    productFlavors {
        phone {
            dimension 'form'
            applicationId 'com.gary.ysplive.phone'
            manifestPlaceholders = [yspTouchRequired: 'true', yspLeanbackRequired: 'false']
        }
        tv {
            dimension 'form'
            applicationId 'com.gary.ysplive.tv'
            manifestPlaceholders = [yspTouchRequired: 'false', yspLeanbackRequired: 'true']
        }
    }

    signingConfigs {
        create('release') {
            if (hasReleaseKey) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            } else {
                // 兜底：仓库内没有发布密钥时用调试密钥，至少保证产物可安装
                storeFile file('C:/1/ysp-android/tools/debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            applicationIdSuffix ''
            versionNameSuffix ''
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            // 产物名带上 flavor，一眼能区分手机版/电视版
            def flavor = variant.flavorName ?: 'all'
            def buildKind = variant.buildType.name == 'release' ? '' : '-debug'
            outputFileName = "YspLive-${flavor}-v9.6.4${buildKind}.apk"
        }
    }
}

dependencies {
    implementation project(':core')
    implementation 'androidx.annotation:annotation:1.7.1'
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    testImplementation 'junit:junit:4.13.2'
    // Robolectric：在桌面 JVM 上真实实例化 Activity / 布局 / 触摸事件，
    // 用来给「点击是否生效」这类只能真机发现的问题兜底。
    testImplementation 'org.robolectric:robolectric:4.13'
    testImplementation 'androidx.test:core:1.5.0'
    testImplementation 'androidx.test.ext:junit:1.1.5'
}
