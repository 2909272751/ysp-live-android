plugins {
    id 'com.android.application'
}

// 发布签名：优先用仓库内的 app/ysp-release.jks（或 YSP_KEYSTORE 指定的文件、环境变量口令）；
// 该文件不存在时回退到 tools/debug.keystore，保证任何机器上 assembleRelease 都能产出可安装的 APK。
def releaseStoreFile = System.getenv('YSP_KEYSTORE') ?: 'ysp-release.jks'
def releaseStorePassword = System.getenv('YSP_KEYSTORE_PASS') ?: 'ysp-live-release'
def releaseKeyAlias = System.getenv('YSP_KEY_ALIAS') ?: 'ysplive'
def releaseKeyPassword = System.getenv('YSP_KEY_PASS') ?: 'ysp-live-release'
def hasReleaseKey = file(releaseStoreFile).exists()

android {
    namespace 'com.gary.ysplive'
    compileSdk 34

    defaultConfig {
        applicationId 'com.gary.ysplive'
        minSdk 21
        targetSdk 34
        versionCode 907
        versionName '9.5.2'
        resourceConfigurations += ['zh', 'en']
    }

    signingConfigs {
        create('release') {
            if (hasReleaseKey) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            } else {
                // 兜底：仓库内没有发布密钥时用调试密钥，至少保证产物可安装
                storeFile file('C:/1/ysp-android/tools/debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            applicationIdSuffix ''
            versionNameSuffix ''
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def name = variant.name == 'release' ? 'YspLive-v9.5.2' : 'YspLive-v9.5.2-debug'
            outputFileName = "${name}.apk"
        }
    }
}

dependencies {
    implementation project(':core')
    implementation 'androidx.annotation:annotation:1.7.1'
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    testImplementation 'junit:junit:4.13.2'
    // Robolectric：在桌面 JVM 上真实实例化 Activity / 布局 / 触摸事件，
    // 用来给「点击是否生效」这类只能真机发现的问题兜底。
    testImplementation 'org.robolectric:robolectric:4.13'
    testImplementation 'androidx.test:core:1.5.0'
    testImplementation 'androidx.test.ext:junit:1.1.5'
}
